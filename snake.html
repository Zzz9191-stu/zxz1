<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%232D5A4A'/%3E%3Ctext x='12' y='17' text-anchor='middle' fill='white' font-size='12'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#0F1A2E; color:#E8ECF5;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  gap:16px; padding:20px;
}
h1 { font-size:24px; letter-spacing:4px; }
.score { font-size:16px; color:#9AA39E; }
.score b { color:#D96C3F; font-size:22px; }
canvas {
  background:#1a2740;
  border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.tip { font-size:12px; color:#5A6560; }
.controls { display:flex; gap:10px; }
.controls button {
  background:#2D5A4A; color:#fff; border:none;
  padding:8px 20px; border-radius:6px;
  font-size:14px; cursor:pointer; font-family:inherit;
}
.controls button:hover { background:#1F4236; }
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:10px; z-index:10;
}
.overlay.show { display:flex; }
.overlay h2 { font-size:32px; }
.overlay p { color:#9AA39E; }
.overlay button {
  margin-top:10px; padding:10px 30px;
  background:#D96C3F; color:#fff; border:none;
  border-radius:6px; font-size:15px; cursor:pointer;
}
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="score">得分：<b id="score">0</b></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="tip">方向键 / WASD 控制方向</div>
  <div class="overlay" id="overlay">
    <h2 id="over-text">游戏结束</h2>
    <p id="over-score"></p>
    <button onclick="restart()">重新开始</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SIZE = 20; // 每格 20px
const GRID = 20; // 20x20 格

let snake, dir, food, score, gameOver, loop;

function init() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir = {x:1, y:0};
  score = 0;
  gameOver = false;
  document.getElementById('score').textContent = score;
  placeFood();
  document.getElementById('overlay').classList.remove('show');
  clearInterval(loop);
  loop = setInterval(tick, 120);
  draw();
}

function placeFood() {
  while (true) {
    food = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function tick() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return end();
  // 撞自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) return end();

  snake.unshift(head);

  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#1a2740';
  ctx.fillRect(0, 0, 400, 400);

  // 食物
  ctx.fillStyle = '#D96C3F';
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE/2, food.y * SIZE + SIZE/2, SIZE/2 - 2, 0, Math.PI*2);
  ctx.fill();

  // 蛇身
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4CAF7D' : '#2D5A4A';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

function end() {
  gameOver = true;
  clearInterval(loop);
  document.getElementById('over-score').textContent = '最终得分：' + score;
  document.getElementById('overlay').classList.add('show');
}

function restart() { init(); }

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k === 'arrowup' || k === 'w') && dir.y !== 1) dir = {x:0, y:-1};
  else if ((k === 'arrowdown' || k === 's') && dir.y !== -1) dir = {x:0, y:1};
  else if ((k === 'arrowleft' || k === 'a') && dir.x !== 1) dir = {x:-1, y:0};
  else if ((k === 'arrowright' || k === 'd') && dir.x !== -1) dir = {x:1, y:0};
});

init();
</script>
</body>
</html>
