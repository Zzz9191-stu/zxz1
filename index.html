<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZXZ 的项目集合</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%232D5A4A'/%3E%3Ctext x='12' y='16' text-anchor='middle' fill='white' font-size='12' font-family='monospace'%3EZX%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: 'Noto Sans SC', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #F5F3EE;
  color: #1C2321;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.wrap { width: 100%; max-width: 720px; }
.head { margin-bottom: 36px; }
.head .eyebrow {
  font-size: 12px;
  letter-spacing: 3px;
  color: #9AA39E;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.head h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.2;
}
.head p {
  color: #5A6560;
  margin-top: 10px;
  font-size: 14px;
}
.cards { display: grid; gap: 16px; }
.card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 24px 28px;
  background: #fff;
  border: 1px solid #E2DED3;
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(28,35,33,.08);
  border-color: #2D5A4A;
}
.card .icon {
  width: 52px; height: 52px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.card .icon svg { width: 26px; height: 26px; }
.card.media .icon { background: #E3EBE6; color: #2D5A4A; }
.card.pelican .icon { background: #F7EEDB; color: #B8862E; }
.card.matrix .icon { background: #E0F5E5; color: #1F7A3D; }
.card.clock .icon { background: #E8ECF5; color: #3A4A6B; }
.card.sketch .icon { background: #FBE9DF; color: #C25A2E; }
.card .info { flex: 1; }
.card .name {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
}
.card .desc {
  font-size: 13px;
  color: #5A6560;
  margin-top: 4px;
}
.card .arrow {
  font-size: 20px;
  color: #9AA39E;
  transition: transform .15s, color .15s;
}
.card:hover .arrow { transform: translateX(4px); color: #2D5A4A; }
.foot {
  margin-top: 32px;
  font-size: 12px;
  color: #9AA39E;
  text-align: center;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">ZXZ · PROJECTS</div>
    <h1>项目集合</h1>
    <p>同一个仓库里的两个小项目，点击进入。</p>
  </div>
  <div class="cards">
    <a class="card media" href="media-library.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/>
          <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>
        </svg>
      </div>
      <div class="info">
        <div class="name">媒体库管理系统</div>
        <div class="desc">图书 / 视频 / 图画的增删改查、统计与本地存储</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card pelican" href="pelican.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </div>
      <div class="info">
        <div class="name">鹈鹕扛车跑</div>
        <div class="desc">SVG 2D 动画小剧场</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card matrix" href="matrix-rain.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 4v16M12 4v16M17 4v16"/>
          <path d="M7 8h.01M7 12h.01M12 10h.01M12 14h.01M17 6h.01M17 12h.01M17 16h.01"/>
        </svg>
      </div>
      <div class="info">
        <div class="name">黑客帝国数字雨</div>
        <div class="desc">Canvas 字符流，鼠标划过扰动</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card clock" href="clock.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </div>
      <div class="info">
        <div class="name">实时时钟</div>
        <div class="desc">大字体翻页，白天 / 黑夜自动换肤</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card sketch" href="sketch-board.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
      </div>
      <div class="info">
        <div class="name">画板涂鸦板</div>
        <div class="desc">选色、粗细、橡皮擦、保存 PNG</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <div class="foot">
    <a href="https://github.com/Zzz9191-stu/zxz1" style="color:#9AA39e; text-decoration:none;">github.com/Zzz9191-stu/zxz1</a>
  </div>
</div>
</body>
</html>
