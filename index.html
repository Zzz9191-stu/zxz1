<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="鹈鹕扛着自行车奔跑的 SVG 2D 动画小剧场">
<title>鹈鹕扛车跑 · SVG 动画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='15' r='11' fill='%23FDFDFD' stroke='%23D8D8D8'/%3E%3Cpolygon points='22,10 30,15 22,20' fill='%23F4A261'/%3E%3Ccircle cx='13' cy='15' r='2' fill='%231A1A1A'/%3E%3C/svg%3E">
<style>
  :root{
    --teal:#2A9D8F; --teal-d:#21867A;
    --ink:#2B3A42; --muted:#6B7C86;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:28px 16px;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 15% -10%, #D6F0FF 0%, rgba(214,240,255,0) 60%),
      radial-gradient(900px 460px at 110% 110%, #FFF3D9 0%, rgba(255,243,217,0) 55%),
      linear-gradient(180deg,#F4FAFD 0%, #EAF2F7 100%);
  }
  .stage{ width:min(940px,100%); }
  header{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    margin-bottom:14px;
  }
  header h1{
    font-size:30px; letter-spacing:2px;
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  }
  header p{ color:var(--muted); font-size:14px; }
  #toggle{
    margin-left:auto; align-self:center;
    border:0; cursor:pointer;
    background:var(--teal); color:#fff;
    font-size:14px; letter-spacing:2px;
    padding:9px 22px; border-radius:999px;
    box-shadow:0 4px 12px rgba(42,157,143,.35);
    transition:background .2s, transform .1s;
  }
  #toggle:hover{ background:var(--teal-d); }
  #toggle:active{ transform:scale(.96); }
  .card{
    background:#fff; border-radius:20px; padding:14px;
    box-shadow:0 18px 46px rgba(43,59,66,.14), 0 2px 8px rgba(43,59,66,.06);
  }
  .card svg{ display:block; width:100%; height:auto; border-radius:12px; }
  .caption{ margin-top:12px; text-align:center; color:var(--muted); font-size:13px; letter-spacing:1px; }
  .css-anim{ will-change:transform; }
  .cloud{ animation:drift 44s linear infinite; }
  .ground-move, .road-move{ animation:groundMove 2.6s linear infinite; }
  .dust{ animation:puff .64s linear infinite; transform-box:fill-box; transform-origin:center; }
  .dust.d2{ animation-delay:.32s; }
  @keyframes drift{
    from{ transform:translateX(-240px); }
    to{ transform:translateX(1040px); }
  }
  @keyframes groundMove{
    from{ transform:translateX(0); }
    to{ transform:translateX(-200px); }
  }
  @keyframes puff{
    0%{ opacity:0; transform:scale(.35); }
    35%{ opacity:.6; }
    100%{ opacity:0; transform:scale(1.5); }
  }
  html.paused .css-anim{ animation-play-state:paused !important; }
</style>
</head>
<body>
<main class="stage">
  <header>
    <h1>鹈鹕扛车跑</h1>
    <p>白色大嘴大力士的晨练时间</p>
    <button id="toggle" type="button">暂停</button>
  </header>

  <div class="card">
    <svg id="scene" viewBox="0 0 800 500" role="img" aria-label="鹈鹕扛着自行车奔跑的循环动画">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8FD8F7"/>
          <stop offset="1" stop-color="#EAF9FF"/>
        </linearGradient>
      </defs>

      <!-- ===== 天空 ===== -->
      <rect width="800" height="500" fill="url(#skyGrad)"/>

      <!-- 太阳与光芒 -->
      <g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 690 84" to="360 690 84" dur="30s" repeatCount="indefinite"/>
          <g stroke="#FFD166" stroke-width="5" stroke-linecap="round">
            <line x1="732" y1="84" x2="744" y2="84"/>
            <line x1="720" y1="114" x2="727" y2="124"/>
            <line x1="690" y1="126" x2="690" y2="138"/>
            <line x1="660" y1="114" x2="653" y2="124"/>
            <line x1="648" y1="84" x2="636" y2="84"/>
            <line x1="660" y1="54" x2="653" y2="44"/>
            <line x1="690" y1="42" x2="690" y2="30"/>
            <line x1="720" y1="54" x2="727" y2="44"/>
          </g>
        </g>
        <circle cx="690" cy="84" r="32" fill="#FFD166"/>
        <circle cx="682" cy="76" r="10" fill="#FFE29A" opacity=".7"/>
      </g>

      <!-- 飘动的云朵 -->
      <g transform="translate(150,86)">
        <g class="cloud css-anim" style="animation-delay:-14s">
          <ellipse cx="0" cy="0" rx="46" ry="20" fill="#fff" opacity=".95"/>
          <ellipse cx="34" cy="-9" rx="28" ry="15" fill="#fff" opacity=".95"/>
          <ellipse cx="-36" cy="5" rx="26" ry="13" fill="#fff" opacity=".95"/>
        </g>
      </g>
      <g transform="translate(480,128)">
        <g class="cloud css-anim" style="animation-delay:-31s">
          <ellipse cx="0" cy="0" rx="34" ry="15" fill="#fff" opacity=".9"/>
          <ellipse cx="24" cy="-7" rx="20" ry="11" fill="#fff" opacity=".9"/>
        </g>
      </g>
      <g transform="translate(745,60)">
        <g class="cloud css-anim" style="animation-delay:-4s">
          <ellipse cx="0" cy="0" rx="38" ry="16" fill="#fff" opacity=".92"/>
          <ellipse cx="-26" cy="4" rx="22" ry="12" fill="#fff" opacity=".92"/>
          <ellipse cx="26" cy="-6" rx="18" ry="10" fill="#fff" opacity=".92"/>
        </g>
      </g>

      <!-- 远山 -->
      <ellipse cx="180" cy="438" rx="300" ry="64" fill="#BDEBB8"/>
      <ellipse cx="640" cy="450" rx="320" ry="70" fill="#B2E3AC"/>

      <!-- ===== 滚动前景（树木灌木，周期 200） ===== -->
      <g class="ground-move css-anim">
        <g fill="#8D6E63"><rect x="136" y="356" width="8" height="52" rx="3"/><rect x="336" y="356" width="8" height="52" rx="3"/><rect x="536" y="356" width="8" height="52" rx="3"/><rect x="736" y="356" width="8" height="52" rx="3"/><rect x="936" y="356" width="8" height="52" rx="3"/></g>
        <g>
          <circle cx="140" cy="342" r="26" fill="#58A04D"/>
          <circle cx="128" cy="352" r="16" fill="#63AD53"/>
          <circle cx="152" cy="352" r="16" fill="#63AD53"/>
          <circle cx="340" cy="342" r="26" fill="#58A04D"/>
          <circle cx="328" cy="352" r="16" fill="#63AD53"/>
          <circle cx="352" cy="352" r="16" fill="#63AD53"/>
          <circle cx="540" cy="342" r="26" fill="#58A04D"/>
          <circle cx="528" cy="352" r="16" fill="#63AD53"/>
          <circle cx="552" cy="352" r="16" fill="#63AD53"/>
          <circle cx="740" cy="342" r="26" fill="#58A04D"/>
          <circle cx="728" cy="352" r="16" fill="#63AD53"/>
          <circle cx="752" cy="352" r="16" fill="#63AD53"/>
          <circle cx="940" cy="342" r="26" fill="#58A04D"/>
          <circle cx="928" cy="352" r="16" fill="#63AD53"/>
          <circle cx="952" cy="352" r="16" fill="#63AD53"/>
        </g>
        <g fill="#6AB04C">
          <circle cx="45" cy="412" r="16"/><circle cx="58" cy="404" r="13"/><circle cx="32" cy="406" r="11"/>
          <circle cx="245" cy="412" r="16"/><circle cx="258" cy="404" r="13"/><circle cx="232" cy="406" r="11"/>
          <circle cx="445" cy="412" r="16"/><circle cx="458" cy="404" r="13"/><circle cx="432" cy="406" r="11"/>
          <circle cx="645" cy="412" r="16"/><circle cx="658" cy="404" r="13"/><circle cx="632" cy="406" r="11"/>
          <circle cx="845" cy="412" r="16"/><circle cx="858" cy="404" r="13"/><circle cx="832" cy="406" r="11"/>
        </g>
        <g fill="#5DA345">
          <circle cx="165" cy="414" r="11"/><circle cx="365" cy="414" r="11"/><circle cx="565" cy="414" r="11"/><circle cx="765" cy="414" r="11"/><circle cx="965" cy="414" r="11"/>
        </g>
      </g>

      <!-- 草地与路面 -->
      <rect y="418" width="800" height="22" fill="#8FD978"/>
      <rect y="440" width="800" height="60" fill="#B7B7B7"/>
      <rect y="440" width="800" height="3" fill="#A8A8A8"/>

      <!-- 路面标线与速度线（周期 200） -->
      <g class="road-move css-anim">
        <g fill="#F2F2F2">
          <rect x="15" y="468" width="90" height="6" rx="3"/>
          <rect x="215" y="468" width="90" height="6" rx="3"/>
          <rect x="415" y="468" width="90" height="6" rx="3"/>
          <rect x="615" y="468" width="90" height="6" rx="3"/>
          <rect x="815" y="468" width="90" height="6" rx="3"/>
        </g>
        <g fill="#E9E9E9" opacity=".85">
          <rect x="120" y="436" width="24" height="3" rx="1.5"/>
          <rect x="160" y="444" width="16" height="3" rx="1.5"/>
          <rect x="320" y="436" width="24" height="3" rx="1.5"/>
          <rect x="360" y="444" width="16" height="3" rx="1.5"/>
          <rect x="520" y="436" width="24" height="3" rx="1.5"/>
          <rect x="560" y="444" width="16" height="3" rx="1.5"/>
          <rect x="720" y="436" width="24" height="3" rx="1.5"/>
          <rect x="760" y="444" width="16" height="3" rx="1.5"/>
          <rect x="920" y="436" width="24" height="3" rx="1.5"/>
          <rect x="960" y="444" width="16" height="3" rx="1.5"/>
        </g>
      </g>

      <!-- 脚下扬尘 -->
      <g class="dust css-anim" transform="translate(315,438)">
        <ellipse cx="0" cy="0" rx="11" ry="5" fill="#D9D9D9"/>
        <ellipse cx="9" cy="2" rx="7" ry="4" fill="#E3E3E3"/>
        <ellipse cx="-9" cy="2" rx="7" ry="4" fill="#E3E3E3"/>
      </g>
      <g class="dust d2 css-anim" transform="translate(355,438)">
        <ellipse cx="0" cy="0" rx="11" ry="5" fill="#D9D9D9"/>
        <ellipse cx="9" cy="2" rx="7" ry="4" fill="#E3E3E3"/>
        <ellipse cx="-9" cy="2" rx="7" ry="4" fill="#E3E3E3"/>
      </g>

      <!-- ===== 远处（后）腿 ===== -->
      <g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="30 310 392;-34 310 392;30 310 392" keyTimes="0;0.5;1" dur="0.64s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0;0 0" keyTimes="0;0.25;0.5;1" dur="0.64s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
            <line x1="310" y1="392" x2="300" y2="438" stroke="#E76F51" stroke-width="11" stroke-linecap="round"/>
            <ellipse cx="300" cy="442" rx="13" ry="5" fill="#E76F51"/>
            <circle cx="287" cy="438" r="2.6" fill="#E76F51"/>
            <circle cx="300" cy="436.5" r="2.6" fill="#E76F51"/>
            <circle cx="313" cy="438" r="2.6" fill="#E76F51"/>
          </g>
        </g>
      </g>

      <!-- ===== 扛在背上的自行车（在鹈鹕身后） ===== -->
      <g transform="translate(150,240) rotate(-4)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0;0 -9;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.64s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>

          <!-- 后轮（空转） -->
          <g>
            <circle cx="0" cy="0" r="42" fill="none" stroke="#343434" stroke-width="8"/>
            <circle cx="0" cy="0" r="38" fill="none" stroke="#CFCFCF" stroke-width="2"/>
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
              <circle cx="0" cy="0" r="6" fill="#616161"/>
              <g stroke="#BDBDBD" stroke-width="2">
                <line x1="0" y1="-36" x2="0" y2="36"/>
                <line x1="36" y1="0" x2="-36" y2="0"/>
                <line x1="25" y1="-25" x2="-25" y2="25"/>
                <line x1="-25" y1="-25" x2="25" y2="25"/>
                <line x1="0" y1="-25" x2="0" y2="25"/>
                <line x1="-25" y1="0" x2="25" y2="0"/>
              </g>
            </g>
          </g>

          <!-- 前轮（空转） -->
          <g>
            <circle cx="300" cy="0" r="42" fill="none" stroke="#343434" stroke-width="8"/>
            <circle cx="300" cy="0" r="38" fill="none" stroke="#CFCFCF" stroke-width="2"/>
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0 300 0" to="360 300 0" dur="1.5s" repeatCount="indefinite"/>
              <circle cx="300" cy="0" r="6" fill="#616161"/>
              <g stroke="#BDBDBD" stroke-width="2">
                <line x1="300" y1="-36" x2="300" y2="36"/>
                <line x1="336" y1="0" x2="264" y2="0"/>
                <line x1="325" y1="-25" x2="275" y2="25"/>
                <line x1="275" y1="-25" x2="325" y2="25"/>
                <line x1="300" y1="-25" x2="300" y2="25"/>
                <line x1="275" y1="0" x2="325" y2="0"/>
              </g>
            </g>
          </g>

          <!-- 车架（青绿色） -->
          <g stroke="#2A9D8F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <line x1="0" y1="0" x2="140" y2="15"/>
            <line x1="110" y1="-45" x2="0" y2="0"/>
            <line x1="140" y1="15" x2="110" y2="-45"/>
            <line x1="140" y1="15" x2="268" y2="-20"/>
            <line x1="265" y1="-35" x2="268" y2="-20"/>
            <line x1="268" y1="-20" x2="300" y2="0"/>
            <line x1="110" y1="-45" x2="265" y2="-35"/>
            <line x1="110" y1="-45" x2="105" y2="-52"/>
            <line x1="265" y1="-35" x2="258" y2="-48"/>
            <line x1="248" y1="-52" x2="272" y2="-48"/>
          </g>
          <ellipse cx="103" cy="-54" rx="16" ry="5" fill="#6D4C2F"/>
          <circle cx="248" cy="-52" r="4" fill="#333"/>
          <circle cx="272" cy="-48" r="4" fill="#333"/>
          <circle cx="140" cy="15" r="11" fill="#E8E8E8" stroke="#9E9E9E" stroke-width="2.5"/>
          <line x1="0" y1="0" x2="140" y2="15" stroke="#5A5A5A" stroke-width="2" opacity=".8"/>
        </g>
      </g>

      <!-- ===== 远处翅膀（扇动） ===== -->
      <g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 300 300;-40 300 300;0 300 300" keyTimes="0;0.5;1" dur="0.4s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
          <path d="M300,300 Q232,232 204,242 Q238,296 300,322 Z" fill="#D8D8D8" stroke="#C2C2C2" stroke-width="2"/>
        </g>
      </g>

      <!-- ===== 鹈鹕身体组（前倾 + 奔跑起伏） ===== -->
      <g transform="rotate(-6 330 330)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 -7;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.64s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>

          <!-- 尾羽 -->
          <path d="M255,320 L185,285 L215,330 Z" fill="#F0F0F0" stroke="#E2E2E2" stroke-width="1.5"/>
          <path d="M258,335 L190,315 L215,348 Z" fill="#E8E8E8" stroke="#E2E2E2" stroke-width="1.5"/>
          <path d="M260,352 L210,345 L240,362 Z" fill="#F5F5F5" stroke="#E2E2E2" stroke-width="1.5"/>

          <!-- 身体 -->
          <ellipse cx="330" cy="330" rx="100" ry="74" fill="#FDFDFD" stroke="#E4E4E4" stroke-width="2"/>
          <ellipse cx="340" cy="352" rx="80" ry="46" fill="#EFEFEF"/>

          <!-- 脖子 -->
          <path d="M405,300 C428,286 448,272 458,252 C472,258 470,278 452,294 C438,306 420,314 405,318 Z" fill="#FDFDFD" stroke="#E4E4E4" stroke-width="2"/>

          <!-- 头 -->
          <circle cx="462" cy="245" r="25" fill="#FDFDFD" stroke="#E4E4E4" stroke-width="2"/>

          <!-- 冠羽 -->
          <g stroke="#E8E8E8" stroke-width="3" stroke-linecap="round">
            <line x1="444" y1="226" x2="438" y2="216"/>
            <line x1="446" y1="224" x2="444" y2="213"/>
            <line x1="448" y1="226" x2="450" y2="215"/>
          </g>

          <!-- 眼睛 -->
          <circle cx="472" cy="236" r="4.5" fill="#1A1A1A"/>
          <circle cx="473" cy="234" r="1.6" fill="#FFF"/>

          <!-- 上喙（呱呱叫） -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 485 242;5 485 242;0 485 242" keyTimes="0;0.5;1" dur="0.6s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
            <path d="M482,238 L612,240 L606,250 L482,250 Z" fill="#F9C74F" stroke="#E9A83A" stroke-width="2"/>
          </g>

          <!-- 喉囊 -->
          <path d="M482,250 Q548,268 604,246 Q566,292 500,276 Q486,264 482,250 Z" fill="#F4A261" stroke="#E08A3C" stroke-width="2"/>

          <!-- 近处翅膀（抬起扶着车架） -->
          <path d="M372,318 Q410,246 424,192 Q436,242 408,300 Q390,316 372,322 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
        </g>
      </g>

      <!-- ===== 近处（前）腿 ===== -->
      <g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-34 352 392;30 352 392;-34 352 392" keyTimes="0;0.5;1" dur="0.64s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -16;0 0" keyTimes="0;0.5;0.75;1" dur="0.64s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
            <line x1="352" y1="392" x2="344" y2="438" stroke="#E76F51" stroke-width="11" stroke-linecap="round"/>
            <ellipse cx="344" cy="442" rx="13" ry="5" fill="#E76F51"/>
            <circle cx="331" cy="438" r="2.6" fill="#E76F51"/>
            <circle cx="344" cy="436.5" r="2.6" fill="#E76F51"/>
            <circle cx="357" cy="438" r="2.6" fill="#E76F51"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <p class="caption">跑步送车 · 使命必达</p>
</main>

<script>
  var svg = document.getElementById('scene');
  var btn = document.getElementById('toggle');
  var paused = false;
  btn.addEventListener('click', function () {
    paused = !paused;
    if (paused) {
      svg.pauseAnimations();
      document.documentElement.classList.add('paused');
      btn.textContent = '播放';
    } else {
      svg.unpauseAnimations();
      document.documentElement.classList.remove('paused');
      btn.textContent = '暂停';
    }
  });
</script>
</body>
</html>
